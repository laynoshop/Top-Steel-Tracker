<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - Add</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="main-wrap">
  <div class="stats-row" aria-label="Summary">
    <div class="stat-card"><div class="stat-value" id="statOccupied">0</div><div class="stat-label">Occupied</div></div>
    <div class="stat-card"><div class="stat-value" id="statOpen">214</div><div class="stat-label">Open</div></div>
    <div class="stat-card"><div class="stat-value">214</div><div class="stat-label">Total Locations</div></div>
  </div>
  <section aria-label="Add a pallet">
    <div class="section-title">
      <span>Select an open location to add a pallet</span>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:var(--color-surface);border:1px solid var(--color-border);"></span>Open</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--color-primary);"></span>Occupied</span>
      </div>
    </div>
    <div class="grid-container" id="gridContainer"></div>
  </section>
</main>

<nav id="bottomNav"></nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Top Steel #<span id="modalLocNum"></span></h2>
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="reminder-banner">
        <span class="reminder-text">&#9888;&#65039; REMINDER: This does not replace VizPick, a pallet ID must still be created before putting up in the top steel (unless it is New Mod freight)</span>
      </div>
      <div class="field">
        <label for="fieldDescription">Pallet Description</label>
        <input id="fieldDescription" type="text" placeholder="ex: Feature pallet of chips">
      </div>
      <div class="field">
        <label for="fieldArea">Freight/Feature belongs to what area of the store</label>
        <select id="fieldArea" class="field-select">
          <option value="" disabled selected>Select an area</option>
          <option value="Grocery">Grocery</option>
          <option value="Grocery DSD">Grocery DSD</option>
          <option value="Consumables">Consumables</option>
          <option value="Fashion">Fashion</option>
          <option value="GM">GM</option>
          <option value="Automotive">Automotive</option>
          <option value="Fixtures/Shelves">Fixtures/Shelves</option>
        </select>
      </div>
      <div class="field">
        <label for="fieldDate">Date &amp; Time Added</label>
        <input id="fieldDate" type="text" placeholder="MM/DD, HH:MM AM/PM">
        <span class="field-hint" id="dateHint">Auto-filled. Admins can adjust.</span>
      </div>
      <div class="field">
        <label for="fieldAssociate">PLE Associate (who is placing in Top Steel)</label>
        <input id="fieldAssociate" type="text" placeholder="e.g. J. Alvarez">
      </div>
      <div class="field">
        <label for="fieldNotes">Notes</label>
        <textarea id="fieldNotes" placeholder="Additional notes about this pallet..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script src="./grid.js"></script>
<script src="./add.js"></script>
<script>
  tsInitPage("add");
  tsInitAddPage();
</script>
</body>
</html>
