<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="main-wrap">

  <!-- Step banner -->
  <div class="move-steps" id="moveSteps">
    <div class="move-step" id="step1Indicator">
      <span class="move-step-num">1</span>
      <span class="move-step-label">Pick source</span>
    </div>
    <div class="move-step-arrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
    <div class="move-step" id="step2Indicator">
      <span class="move-step-num">2</span>
      <span class="move-step-label">Pick destination</span>
    </div>
    <div class="move-step-arrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
    <div class="move-step" id="step3Indicator">
      <span class="move-step-num">3</span>
      <span class="move-step-label">Confirm</span>
    </div>
  </div>

  <section>
    <div class="section-title">
      <span id="gridHeadingText">Select the location you want to move</span>
      <div class="legend" id="step2Legend" style="display:none;">
        <span class="legend-item"><span class="legend-dot" style="background:var(--color-surface);border:1px solid var(--color-border);"></span>Open (move)</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--color-primary);"></span>Occupied (swap)</span>
      </div>
    </div>

    <!-- Selected source chip -->
    <div class="move-selected-wrap" id="selectedSourceWrap" style="display:none;">
      <span class="move-selected-chip">
        Moving: <strong id="selectedSourceLabel"></strong>
        <button class="move-chip-clear" id="clearSourceBtn" aria-label="Clear selection">&times;</button>
      </span>
    </div>

    <div class="grid-container" id="gridContainer"></div>
  </section>
</main>

<nav id="bottomNav"></nav>

<!-- Confirmation modal -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="confirmTitle">Confirm Move</h2>
    </div>
    <div class="modal-body">
      <p class="move-confirm-desc">Please review the details below before confirming.</p>
      <div class="detail-row">
        <span class="detail-label">From (source)</span>
        <span class="detail-value" id="confirmFrom"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Pallet being moved</span>
        <span class="detail-value" id="confirmDesc"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Area</span>
        <span class="detail-value" id="confirmArea"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">To (destination)</span>
        <span class="detail-value" id="confirmTo"></span>
      </div>
      <!-- Only shown when destination is occupied (swap) -->
      <div class="detail-row" id="confirmToRow" style="display:none;">
        <span class="detail-label">Pallet being swapped back</span>
        <span class="detail-value" id="confirmToDesc"></span>
      </div>
    </div>
    <div class="modal-footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmMoveBtn">Yes, Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script src="./grid.js"></script>
<script src="./move.js"></script>
<script>
  tsInitPage("move");
  tsInitMovePage();
</script>
</body>
</html>
