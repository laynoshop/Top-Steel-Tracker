<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="login-screen">
  <form class="login-box" id="loginForm">
    <svg class="login-logo" viewBox="0 0 40 40" fill="none" aria-label="Top Steel Tracker logo">
      <rect x="3" y="3" width="34" height="34" rx="6" fill="#0a5c8a"/>
      <path d="M11 27V13h4.2l4.1 8.6L23.4 13H27.6V27H23.9V18.9L20.3 27H18L14.7 18.9V27Z" fill="#f5f6f7"/>
    </svg>
    <h1 class="login-title">Top Steel Tracker</h1>
    <p class="login-sub">Enter your access code to continue</p>
    <label for="accessCodeInput" class="sr-only">Access code</label>
    <input
      id="accessCodeInput"
      class="login-input"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Access code"
      maxlength="12"
      autofocus
    >
    <p class="login-error" id="loginError" role="alert"></p>
    <button type="submit" class="login-btn">Enter</button>
  </form>
</div>

<script src="./login.js"></script>
<script>
  tsInitLoginForm();
</script>
</body>
</html>
