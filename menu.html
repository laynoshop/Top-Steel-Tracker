<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="main-wrap">
  <div class="menu-screen">
    <div>
      <p class="menu-title">What would you like to do?</p>
    </div>

    <div class="menu-stats">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-value" id="statOccupied">0</div><div class="stat-label">Occupied</div></div>
        <div class="stat-card"><div class="stat-value" id="statOpen">214</div><div class="stat-label">Open</div></div>
        <div class="stat-card"><div class="stat-value">214</div><div class="stat-label">Total</div></div>
      </div>
    </div>

    <div class="menu-actions">
      <a class="menu-btn" href="./add.html">
        <div class="menu-btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div class="menu-btn-text">
          <span class="menu-btn-label">Add Pallet</span>
          <span class="menu-btn-desc">Assign a pallet to a top steel location</span>
        </div>
      </a>

      <a class="menu-btn" href="./move.html">
        <div class="menu-btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <div class="menu-btn-text">
          <span class="menu-btn-label">Move Top Steel Pallets</span>
          <span class="menu-btn-desc">Relocate a pallet from one spot to another</span>
        </div>
      </a>

      <a class="menu-btn" href="./remove.html">
        <div class="menu-btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
        </div>
        <div class="menu-btn-text">
          <span class="menu-btn-label">Remove Pallet</span>
          <span class="menu-btn-desc">Mark a top steel location as empty</span>
        </div>
      </a>

      <a class="menu-btn" href="./search.html">
        <div class="menu-btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </div>
        <div class="menu-btn-text">
          <span class="menu-btn-label">View / Manage</span>
          <span class="menu-btn-desc">Browse, search, and filter all locations</span>
        </div>
      </a>
    </div>
  </div>
</main>

<nav id="bottomNav"></nav>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script>
  tsInitPage("menu");
  const count = Object.keys(tsGetAllPallets()).length;
  document.getElementById("statOccupied").textContent = count;
  document.getElementById("statOpen").textContent = 214 - count;
</script>
</body>
</html>
