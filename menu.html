<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="menu-screen">
  <div class="menu-stats">
    <div class="stats-row" aria-label="Summary">
      <div class="stat-card">
        <div class="stat-value" id="statOccupied">0</div>
        <div class="stat-label">Occupied</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statOpen">214</div>
        <div class="stat-label">Open</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">214</div>
        <div class="stat-label">Total Locations</div>
      </div>
    </div>
  </div>
  <div>
    <h1 class="menu-title">What do you need to do?</h1>
    <p class="menu-sub">Choose an action to get started</p>
  </div>
  <div class="menu-actions">
    <a class="menu-btn" href="./add.html">
      <span class="menu-btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span class="menu-btn-text">
        <span class="menu-btn-label">Add</span>
        <span class="menu-btn-desc">Assign a pallet to a Top Steel location</span>
      </span>
    </a>
    <a class="menu-btn" href="./remove.html">
      <span class="menu-btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </span>
      <span class="menu-btn-text">
        <span class="menu-btn-label">Remove</span>
        <span class="menu-btn-desc">Clear a pallet from a Top Steel location</span>
      </span>
    </a>
    <a class="menu-btn" href="./search.html">
      <span class="menu-btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <span class="menu-btn-text">
        <span class="menu-btn-label">View/Manage Top Steel</span>
        <span class="menu-btn-desc">Browse, search, and filter all Top Steel locations</span>
      </span>
    </a>
  </div>
</main>

<nav id="bottomNav"></nav>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script>
  tsInitPage("menu");
  // Populate live stats
  (function() {
    var pallets = tsGetAllPallets();
    var count = Object.keys(pallets).length;
    var el = document.getElementById("statOccupied");
    var el2 = document.getElementById("statOpen");
    if (el) el.textContent = count;
    if (el2) el2.textContent = 214 - count;
  })();
</script>
</body>
</html>
