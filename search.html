<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="main-wrap">
  <div class="stats-row" aria-label="Summary">
    <div class="stat-card">
      <div class="stat-value" id="statOccupied">0</div>
      <div class="stat-label">Occupied</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statOpen">214</div>
      <div class="stat-label">Open</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">214</div>
      <div class="stat-label">Total Locations</div>
    </div>
  </div>

  <section aria-label="Search pallets">
    <div class="section-title">
      <span>Search Top Steel</span>
    </div>
    <div class="search-box" style="margin-bottom: var(--space-4); max-width: 480px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search by location, description, or associate" aria-label="Search">
    </div>
    <div class="results-list" id="resultsList"></div>
  </section>
</main>

<nav id="bottomNav"></nav>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script src="./search.js"></script>
<script>
  tsInitPage("search");
  tsInitSearchPage();
</script>
</body>
</html>
