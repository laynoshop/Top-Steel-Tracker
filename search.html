<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - View/Manage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="main-wrap">
  <div class="stats-row" aria-label="Summary">
    <div class="stat-card"><div class="stat-value" id="statOccupied">0</div><div class="stat-label">Occupied</div></div>
    <div class="stat-card"><div class="stat-value" id="statOpen">214</div><div class="stat-label">Open</div></div>
    <div class="stat-card"><div class="stat-value">214</div><div class="stat-label">Total Locations</div></div>
  </div>

  <section aria-label="View and manage Top Steel">
    <div class="section-title"><span>View/Manage Top Steel</span></div>

    <div class="vm-search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search by location, description, associate..." aria-label="Search">
      </div>
    </div>

    <div class="vm-filters">
      <button class="vm-filter-btn" id="filterOccupied" data-filter="occupied">Occupied</button>
      <button class="vm-filter-btn" id="filterOpen" data-filter="open">Open</button>
    </div>

    <div class="vm-filters vm-filters-area">
      <span class="vm-filter-label">Area:</span>
      <button class="vm-filter-btn" data-area="Grocery">Grocery</button>
      <button class="vm-filter-btn" data-area="Grocery DSD">Grocery DSD</button>
      <button class="vm-filter-btn" data-area="Consumables">Consumables</button>
      <button class="vm-filter-btn" data-area="Fashion">Fashion</button>
      <button class="vm-filter-btn" data-area="GM">GM</button>
      <button class="vm-filter-btn" data-area="Automotive">Automotive</button>
      <button class="vm-filter-btn" data-area="Fixtures">Fixtures</button>
    </div>

    <div class="grid-container" id="gridContainer"></div>
  </section>
</main>

<nav id="bottomNav"></nav>

<!-- Detail modal -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="detailTitle">Top Steel #<span id="detailLocNum"></span></h2>
      <button class="modal-close" id="detailClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="detail-row"><span class="detail-label">Pallet Description</span><span class="detail-value" id="detailDescription"></span></div>
      <div class="detail-row"><span class="detail-label">Area of Store</span><span class="detail-value" id="detailArea"></span></div>
      <div class="detail-row"><span class="detail-label">Date &amp; Time Added</span><span class="detail-value" id="detailDate"></span></div>
      <div class="detail-row"><span class="detail-label">PLE Associate</span><span class="detail-value" id="detailAssociate"></span></div>
      <div class="detail-row" id="detailNotesRow"><span class="detail-label">Notes</span><span class="detail-value" id="detailNotes"></span></div>
    </div>
    <div class="modal-footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="btn btn-ghost" id="detailCloseBtn">Close</button>
        <button class="btn btn-primary" id="detailEditBtn" style="display:none;">Edit</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit modal (admin only) -->
<div class="modal-overlay" id="editOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="editTitle">Edit Top Steel #<span id="editLocNum"></span></h2>
      <button class="modal-close" id="editClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="editDescription">Pallet Description</label>
        <input id="editDescription" type="text" placeholder="ex: Feature pallet of chips">
      </div>
      <div class="field">
        <label for="editArea">Freight/Feature belongs to what area of the store</label>
        <select id="editArea" class="field-select">
          <option value="" disabled>Select an area</option>
          <option value="Grocery">Grocery</option>
          <option value="Grocery DSD">Grocery DSD</option>
          <option value="Consumables">Consumables</option>
          <option value="Fashion">Fashion</option>
          <option value="GM">GM</option>
          <option value="Automotive">Automotive</option>
          <option value="Fixtures">Fixtures</option>
        </select>
      </div>
      <div class="field">
        <label for="editDate">Date &amp; Time Added</label>
        <input id="editDate" type="text" placeholder="MM/DD, HH:MM AM/PM">
        <span class="field-hint">Admin adjustable.</span>
      </div>
      <div class="field">
        <label for="editAssociate">PLE Associate</label>
        <input id="editAssociate" type="text" placeholder="e.g. J. Alvarez">
      </div>
      <div class="field">
        <label for="editNotes">Notes</label>
        <textarea id="editNotes" placeholder="Additional notes..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="btn btn-ghost" id="editCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="editSaveBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script src="./grid.js"></script>
<script src="./search.js"></script>
<script>
  tsInitPage("search");
  tsInitSearchPage();
</script>
</body>
</html>
