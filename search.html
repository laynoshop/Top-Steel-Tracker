<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Steel Tracker - View/Manage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header" id="appHeader"></header>

<main class="main-wrap">
  <div class="stats-row" aria-label="Summary">
    <div class="stat-card">
      <div class="stat-value" id="statOccupied">0</div>
      <div class="stat-label">Occupied</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statOpen">214</div>
      <div class="stat-label">Open</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">214</div>
      <div class="stat-label">Total Locations</div>
    </div>
  </div>

  <section aria-label="View and manage Top Steel">
    <div class="section-title">
      <span>View/Manage Top Steel</span>
    </div>

    <!-- Search bar -->
    <div class="vm-search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search by location, description, associate..." aria-label="Search">
      </div>
    </div>

    <!-- Quick filters: status -->
    <div class="vm-filters">
      <button class="vm-filter-btn" id="filterOccupied" data-filter="occupied">Occupied</button>
      <button class="vm-filter-btn" id="filterOpen" data-filter="open">Open</button>
    </div>

    <!-- Quick filters: area (multi-select) -->
    <div class="vm-filters vm-filters-area">
      <span class="vm-filter-label">Area:</span>
      <button class="vm-filter-btn" data-area="Grocery">Grocery</button>
      <button class="vm-filter-btn" data-area="Grocery DSD">Grocery DSD</button>
      <button class="vm-filter-btn" data-area="Consumables">Consumables</button>
      <button class="vm-filter-btn" data-area="Fashion">Fashion</button>
      <button class="vm-filter-btn" data-area="GM">GM</button>
      <button class="vm-filter-btn" data-area="Automotive">Automotive</button>
      <button class="vm-filter-btn" data-area="Fixtures">Fixtures</button>
    </div>

    <!-- Grid -->
    <div class="grid-container" id="gridContainer"></div>
  </section>
</main>

<nav id="bottomNav"></nav>

<!-- Detail modal (occupied slot) -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="detailTitle">Top Steel #<span id="detailLocNum"></span></h2>
      <button class="modal-close" id="detailClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="detail-row">
        <span class="detail-label">Pallet Description</span>
        <span class="detail-value" id="detailDescription"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Area of Store</span>
        <span class="detail-value" id="detailArea"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date Added</span>
        <span class="detail-value" id="detailDate"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">PLE Associate</span>
        <span class="detail-value" id="detailAssociate"></span>
      </div>
      <div class="detail-row" id="detailNotesRow">
        <span class="detail-label">Notes</span>
        <span class="detail-value" id="detailNotes"></span>
      </div>
    </div>
    <div class="modal-footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="btn btn-ghost" id="detailCloseBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./login.js"></script>
<script src="./theme.js"></script>
<script src="./nav.js"></script>
<script src="./data.js"></script>
<script src="./grid.js"></script>
<script src="./search.js"></script>
<script>
  tsInitPage("search");
  tsInitSearchPage();
</script>
</body>
</html>
